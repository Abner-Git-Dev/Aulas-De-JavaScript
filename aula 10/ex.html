<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
</head>
<style>
   
   body {
       font-family: "segoe UI", 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
       background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
       min-height: 100vh;
       margin: 0;
       padding: 20px;


  }
   
     input {
        width: 100%;
        padding: 15px;
        border: 2px solid #ddd;
        border-radius: 10px;
        font-size: 18px;
        margin-bottom: 20px;
        box-sizing: border-box;


        
     }
      
       button{
         width: 100%;
         padding: 15px;
         background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
         color: white;
         border: 10px;
         border-radius: none;
         cursor: pointer;
         font-size: 18px;
        

       }

       #resultado {
          margin-top: 30px;
          padding: 20px;
          background: #f8f9fa;
          border-radius : 10px;
          font-size: 18px;
          line-height: 1.8;
          color: #333;
          width: 100%;
          box-sizing: border-box;
}

</style>
<body>
 <input type="number" id="numero" placeholder="Digite um numero">  
 <button onclick="gerarTabuada()">Gerar Tabuada</button>
 <div id="resultado"></div>


<script>
 function gerarTabuada() {
    // pegar o valor do input
    let numero= document.getElementById('numero').value;
    const resultado = document.getElementById('resultado');

    // Converter para numero
    numero = parseInt(numero);

    // Limpar resultado anterior
    resultado.innerHTML = ''; 

    // Gerar Tabuada
    for (let i = 1; i<= 10; i++) {
          resultado.innerHTML += numero + ' x ' + i + ' = ' + (numero * i) + '<br>';
    
   }
 }

</script>

</body>
</html>
